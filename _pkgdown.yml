url: https://pedrobtz.github.io/zucbor/
template:
  bootstrap: 5

# A release version (0.1.0) builds the site at the root; a development
# version (0.1.0.9000) builds it into dev/, leaving the released docs at the
# root. The deploy step keeps both (clean: false in pkgdown.yaml).
development:
  mode: auto

reference:
  - title: Decode
    contents:
      - cbor_decode
      - cbor_decode_prefix
      - cbor_read
      - cbor_validate
      - cbor_diagnose
      - cbor_annotate
  - title: Encode
    contents:
      - cbor_encode
  - title: Tags and classes of your own
    contents:
      - as_cbor
  - title: Values without an R type
    contents:
      - cbor-values
  - title: Errors and build information
    contents:
      - zucbor-conditions
      - zucbor_info
      - zucbor-package

articles:
  - title: Using zucbor
    navbar: ~
    contents:
      - articles/zucbor
      - articles/examples
      - untrusted
      - cose-webauthn
