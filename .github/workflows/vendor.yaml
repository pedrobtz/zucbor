on:
  push:
    branches: [main, master]
  pull_request:

name: vendor

permissions:
  contents: read

jobs:
  # src/vendor/tinycbor is TinyCBOR verbatim and is never edited in place.
  # tools/verify-vendor re-derives it from the pinned release and fails on any
  # difference; the PR guard then requires a change under src/vendor to come
  # through tools/update-tinycbor, which rewrites the provenance record, with
  # the manifest changed when the file set is. A version bump also fails
  # test-info.R's literal until that is updated, so the guard need not ask.
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      verify: tools/verify-vendor
      must-update: |
        src/vendor/PROVENANCE

  # R CMD check NOTEs a shared object that references stdout/stderr, printf,
  # abort, exit or assert (design section 13, trap 4). Checked on a plain
  # R CMD INSTALL build, which compiles with R's -DNDEBUG as CRAN does.
  symbols:
    runs-on: ubuntu-latest
    name: no console or exit symbols
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install and inspect the shared object
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --no-test-load -l "$RUNNER_TEMP/lib" .
          tools/check-symbols "$RUNNER_TEMP/lib/zucbor/libs/zucbor.so"

  # R maps a fault to a condition class by its CborError enumerator's name.
  # A TinyCBOR update that adds an enumerator must add it to src/zu_cond.c's
  # table on purpose (design section 10).
  status-table:
    runs-on: ubuntu-latest
    name: status table matches cbor.h
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-status-table
